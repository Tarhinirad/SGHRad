# One-click deploy on Render: https://render.com/deploy?repo=https://github.com/tarhinirad/sghrad
# Free setup: Render free web service + free Neon Postgres (DATABASE_URL) to keep the data.
services:
  - type: web
    name: sgumc-radiology-schedule
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TZ_NAME
        value: Asia/Beirut
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: VIEWER_PASSWORD
        sync: false
      # Postgres connection string from neon.tech (free). Without it, data resets on every restart.
      - key: DATABASE_URL
        sync: false
